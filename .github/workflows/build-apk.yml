name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Test and build
        run: gradle testDebugUnitTest assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SecretMelody-apk
          path: app/build/outputs/apk/release/app-release.apk
      # One always-current download link that needs no GitHub login.
      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk SecretMelody.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SecretMelody.apk --target "$GITHUB_SHA" \
            --title "SecretMelody (latest build)" --notes "Built from ${GITHUB_SHA::7}"
